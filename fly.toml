# fly.toml app configuration file generated for art-connect on 2025-04-10T17:56:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'art-connect'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
